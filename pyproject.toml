[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "road-defect-engine"
version = "0.1.0"
description = "CV-движок анализа дорожных дефектов (детекция, форма, размеры, ГОСТ-серьёзность)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["models: тесты, требующие загрузки нейросетей (медленные)"]
